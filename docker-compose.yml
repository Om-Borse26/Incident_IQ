version: "3.9"
services:
  # ─── FastAPI application + Ingestion Worker (subprocess) ──────────────────
  api:
    build: .
    ports:
      - "8000:8080"
    volumes:
      - ./data:/data   # persistent data: chroma_db, tree_index, raw_documents, checkpoints.sqlite
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/data
